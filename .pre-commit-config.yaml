repos:
  # 기본 훅들
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict

  # Cursor Rules 검사
  - repo: local
    hooks:
      - id: check-cursor-rules
        name: Check Cursor Rules alwaysApply setting
        entry: ./scripts/check-cursor-rules.sh
        language: system

  # TypeScript 컴파일 검사
  - repo: local
    hooks:
      - id: typescript-check
        name: TypeScript compilation check
        entry: bash -c 'echo "Checking TypeScript compilation..." && npx tsc --noEmit'
        language: system
        pass_filenames: false
